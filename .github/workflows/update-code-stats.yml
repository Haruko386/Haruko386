name: Update Code::Stats profile graph

on:
  schedule:
    # 00:00 UTC = 08:00 in Asia/Shanghai.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date to retry (YYYY-MM-DD)"
        required: false
        type: string
      bootstrap:
        description: "Refresh the complete 30-day window"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-code-stats-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Haruko386/codestats-profile-readme@master
        with:
          date: ${{ inputs.date }}
          bootstrap: ${{ inputs.bootstrap }}
